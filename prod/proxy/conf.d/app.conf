# HTTP: ACMEチャレンジ用 + アプリへのプロキシ
# server_name に _ を指定することで、すべてのドメインからのリクエストを受け付けます。
# これにより、証明書がない状態でも nginx が起動し、Let's Encrypt の検証（HTTP-01 チャレンジ）が通ります。
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Let's Encrypt 用 webroot（HTTPで受ける）
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # アプリへのリバースプロキシ（初期はHTTPのみ提供）
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://web:3000;

    # SvelteKit 用の WebSocket 対応
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# 注意: HTTPS のサーバーブロックは /etc/nginx/conf.d/ssl.conf として
# 証明書が発行された後に自動で追加され、nginx がリロードされます（nginx_bootstrap.sh が担当）。
